[project]
name = "gerador-de-simulados"
version = "0.23.0"
description = "Aplicação local para criação e correção de simulados OMR com FastAPI, SQLite e OCR."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["external", "avaliacao_web/data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
